[package]
name = "fusionos-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fusionos-backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros", "http1", "json"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "compression-gzip", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
prometheus = { version = "0.13", features = ["process"] }
dotenvy = "0.15"
parking_lot = "0.12"
validator = { version = "0.18", features = ["derive"] }
regex = "1"
once_cell = "1"
hyper = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

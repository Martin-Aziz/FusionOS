server {
  listen 80;
  server_name _;

  # API and system endpoints — proxy to Rust backend
  location ~ ^/(api|health|metrics)/ {
    proxy_pass http://fusionos-api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  # Exact health and metrics paths (without trailing slash)
  location = /health {
    proxy_pass http://fusionos-api:4000;
    proxy_set_header Host $host;
  }

  location = /metrics {
    proxy_pass http://fusionos-api:4000;
    proxy_set_header Host $host;
  }

  # All other requests — Rust serves static frontend + SPA fallback
  location / {
    proxy_pass http://fusionos-api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }
}
